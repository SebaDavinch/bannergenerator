server {
  listen 80;
  listen [::]:80;
  server_name banner.vnws.ru;

  root /var/www/banner.vnws.ru/site;
  index index.html;

  access_log /var/log/nginx/banner.vnws.ru.access.log;
  error_log /var/log/nginx/banner.vnws.ru.error.log warn;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}